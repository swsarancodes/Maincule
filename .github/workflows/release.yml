name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            target: ''
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app & publish to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.6.0
          releaseName: 'Manicule v0.6.0'
          releaseBody: |
            ### Manicule ☞ — Distraction-Free Markdown Studio

            Manicule edits Markdown visually while treating your `.md` file as the single source of truth.

            #### Download & Install
            Choose the installer for your operating system below:
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `Manicule_*_aarch64.dmg`
            - **macOS (Intel)**: `Manicule_*_x64.dmg`
            - **Windows**: `Manicule_*_x64-setup.exe` or `Manicule_*_x64_en-US.msi`
            - **Linux**: `manicule_*_amd64.AppImage` or `manicule_*_amd64.deb`

            ---
            > **macOS Gatekeeper notice**: Since this is an open-source build without an Apple Developer certificate, right-click `Manicule.app` and choose **Open**, or run in Terminal:
            > ```bash
            > xattr -d com.apple.quarantine /Applications/Manicule.app
            > ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
